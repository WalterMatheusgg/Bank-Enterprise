<linearGradient id="edge" x1="0" x2="1"><stop stop-color="#19B59C"/><stop offset="1" stop-color="#43B7ED"/></linearGradient>
<filter id="shadow" x="-15%" y="-15%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="11" flood-color="#172D45" flood-opacity=".09"/></filter>
</defs>
