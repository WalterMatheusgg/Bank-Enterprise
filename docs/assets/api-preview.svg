<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-label="Vértice Bank: API REST, endpoints e operações bancárias">
<title>Vértice Bank Enterprise — documentação visual da API</title>
<desc>Endpoints bancários, contas, transferências e ledger.</desc>
<defs>
