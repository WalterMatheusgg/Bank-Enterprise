spring:
  application:
    name: nexus-bank
  datasource:
    url: ${DB_URL:jdbc:h2:mem:nexusbank;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
server:
  port: ${PORT:8080}
app:
  admin:
    username: ${BANK_ADMIN_USERNAME:admin}
    password: ${BANK_ADMIN_PASSWORD:dev-only-change-me}
management:
  endpoints:
    web:
      exposure:
        include: health,info
