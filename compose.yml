services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nexusbank
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexusbank"]
      interval: 5s
      timeout: 3s
      retries: 15
  api:
    build: .
    ports: ["127.0.0.1:8080:8080"]
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/nexusbank
      DB_USER: nexus
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      BANK_ADMIN_USERNAME: ${BANK_ADMIN_USERNAME:-admin}
      BANK_ADMIN_PASSWORD: ${BANK_ADMIN_PASSWORD:?Set BANK_ADMIN_PASSWORD in .env}
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres_data:
